apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "todo-app.fullname" . }}-backend
spec:
  replicas: {{ .Values.replicaCount.backend }}
  selector:
    matchLabels:
      app: {{ include "todo-app.fullname" . }}-backend
  template:
    metadata:
      labels:
        app: {{ include "todo-app.fullname" . }}-backend
    spec:
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image | quote }}
          command:
            - sh
            - -c
            - >-
              until pg_isready -h {{ include "todo-app.fullname" . }}-postgres -p {{ .Values.postgres.service.port }} -U {{ .Values.postgres.db.user }};
              do echo "waiting for postgres"; sleep 2; done
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.backend.port }}
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "todo-app.fullname" . }}-back-config
                  key: DATABASE_URL
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "todo-app.fullname" . }}-back-config
                  key: APP_NAME
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "todo-app.fullname" . }}-back-config
                  key: PORT
            - name: API_BASE_PATH
              valueFrom:
                configMapKeyRef:
                  name: {{ include "todo-app.fullname" . }}-back-config
                  key: API_BASE_PATH
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "todo-app.fullname" . }}-back-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "todo-app.fullname" . }}-back-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ include "todo-app.fullname" . }}-back-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "todo-app.fullname" . }}-back-config
                  key: DB_USER
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "todo-app.fullname" . }}-todo-secret
                  key: ADMIN_TOKEN
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "todo-app.fullname" . }}-todo-secret
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: {{ .Values.config.apiBasePath }}/health
              port: {{ .Values.service.backend.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "todo-app.fullname" . }}-backend
spec:
  type: {{ .Values.service.backend.type }}
  selector:
    app: {{ include "todo-app.fullname" . }}-backend
  ports:
    - port: {{ .Values.service.backend.port }}
      targetPort: {{ .Values.service.backend.port }}
