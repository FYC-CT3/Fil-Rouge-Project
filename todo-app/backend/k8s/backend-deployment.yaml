    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: todo-backend
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: todo-backend
      template:
        metadata:
          labels:
            app: todo-backend
        spec:
          containers:
          - name: backend
            image: todo-backend:v1
            ports:
            - containerPort: 3000